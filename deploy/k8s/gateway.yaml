# Gateway: stateless, horizontally scaled behind a Service, autoscaled on CPU
# and active-connections-per-pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app: gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gateway
          image: chat-gateway:latest        # build from ./Dockerfile target gateway
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: chat-config }
            - secretRef: { name: chat-secret }
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "250m", memory: "128Mi" }
            limits: { cpu: "1", memory: "512Mi" }
      # Give in-flight WebSocket connections time to drain on rollout.
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: { app: gateway }
spec:
  type: LoadBalancer        # L4 LB for WebSocket traffic
  selector: { app: gateway }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
# CPU + a custom active-connections-per-pod metric.
# The Pods metric requires prometheus-adapter to expose `chat_active_connections`
# as a custom metric (see deploy/k8s/README.md).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Pods
      pods:
        metric:
          name: chat_active_connections
        target:
          type: AverageValue
          averageValue: "8000"   # scale out before the ~10k/pod target
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
